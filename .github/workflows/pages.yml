name: Publish approved documentation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'I have approved publishing the current main branch to GitHub Pages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m pip install -c requirements/figures-py312.txt -e '.[docs,examples]'
      - name: Build checked site
        env:
          MODELATLAS_DOCS_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sphinx-build -W -n -b html docs docs/_build/html
          python scripts/check_docs.py docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
