name: Tests and distributions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        dependencies: [latest]
        include:
          - python: '3.10'
            dependencies: minimum
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tooling.txt
            requirements/minimum-py310.txt
      - name: Install editable package
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          constraints=(-c requirements/tooling.txt)
          if [[ "$DEPENDENCIES" == minimum ]]; then
            constraints+=(-c requirements/minimum-py310.txt)
          fi
          python -m pip install "${constraints[@]}" -e '.[test]'
      - name: Run numerical and plotting tests
        run: |
          mkdir -p reports
          python -m pytest --cov=modelatlas --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/tests.xml | tee reports/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python }}-${{ matrix.dependencies }}
          path: reports/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/figures-py312.txt -r requirements/tooling.txt -e .
      - run: ruff check src tests examples scripts docs/conf.py docs/_ext noxfile.py
      - run: mypy

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/tooling.txt
      - name: Build and check metadata
        run: |
          mkdir -p reports
          python -m build 2>&1 | tee reports/build.log
          python -m twine check --strict dist/* | tee -a reports/build.log
      - name: Smoke-test the wheel and sdist independently
        run: |
          for kind in wheel sdist; do
            if [[ "$kind" == wheel ]]; then
              package=(dist/*.whl)
            else
              package=(dist/*.tar.gz)
            fi
            venv="$RUNNER_TEMP/modelatlas-$kind"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install "${package[0]}"
            (cd "$RUNNER_TEMP" && "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke.py") | tee -a reports/build.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributions-and-build-log
          path: |
            dist/
            reports/
          retention-days: 14
