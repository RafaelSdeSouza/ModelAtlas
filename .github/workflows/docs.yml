name: Documentation preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/figures-py312.txt
      - run: python -m pip install -c requirements/figures-py312.txt -e '.[docs,examples]'
      - name: Build and verify the full gallery
        run: |
          mkdir -p docs/_build
          sphinx-build -W -n -b html docs docs/_build/html 2>&1 | tee docs/_build/docs.log
          python scripts/check_docs.py docs/_build/html | tee -a docs/_build/docs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-docs-preview
          path: |
            docs/_build/html/
            docs/_build/docs.log
          retention-days: 14
